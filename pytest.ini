[pytest]
# Let tests do "import bitutils" from the project root.
pythonpath = .
testpaths = tests
# Capture output at the Python level, not by replacing file descriptors:
# with the default fd capture, creating a second Tk window in the same test
# process intermittently failed on Windows ("Can't find a usable init.tcl",
# 7 of 15 runs); with --capture=sys it failed 0 of 15 runs.
addopts = --capture=sys
